<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mines — упрощённая версия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { font-family: system-ui; background: #0a0f1e; color: white; padding: 16px; }
        button { background: #00c6ff; border: none; padding: 12px; border-radius: 30px; margin-top: 10px; width: 100%; color: white; font-size: 18px; }
        .game-field { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 20px 0; }
        .cell { aspect-ratio: 1; background: #1e2a3e; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; }
        .cell.opened-safe { background: #0f3b2c; }
        .cell.opened-mine { background: #8b0000; }
        .multiplier { font-size: 48px; text-align: center; margin: 15px 0; color: gold; }
    </style>
</head>
<body>
<div style="max-width:500px; margin:0 auto;">
    <div style="background: #1e2a3a; border-radius: 60px; padding: 12px 24px; display: flex; justify-content: space-between;">
        <span>⭐ Звёзды</span>
        <span id="balance">0</span>
    </div>
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="game-field" id="minesField"></div>
    <button id="cashoutBtn">💰 ЗАБРАТЬ</button>
    <button id="newGameBtn">🔄 НОВАЯ ИГРА</button>
    <p id="status" style="margin-top: 20px;"></p>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Получение данных пользователя (с заглушкой, если нет)
    let user = tg.initDataUnsafe?.user;
    let currentUserId = user ? String(user.id) : "anon_" + Math.random().toString(36);
    let currentUserName = user ? (user.first_name || "Player") : "Player";
    const ADMIN_ID = "8302346583";
    const isAdmin = (currentUserId === ADMIN_ID);
    if (isAdmin) alert("Вы администратор!"); // просто для проверки

    let stars = 100; // стартовые звёзды для теста
    document.getElementById('balance').innerText = stars;

    // Простейшая игра "Мина"
    let gameActive = false;
    let bet = 0;
    let multiplier = 1;
    let opened = [];
    let mines = [];
    let cells = [];

    function initField() {
        const container = document.getElementById('minesField');
        container.innerHTML = '';
        for (let i=0;i<16;i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            cell.innerText = '❓';
            cell.onclick = () => openCell(i);
            container.appendChild(cell);
        }
        cells = document.querySelectorAll('.cell');
    }

    function startNewRound() {
        if (gameActive) { alert("Игра уже идёт"); return; }
        bet = parseInt(prompt("Ваша ставка (звёзды):", "10"));
        if (isNaN(bet) || bet <= 0) return;
        if (stars < bet) { alert("Не хватает звёзд"); return; }
        stars -= bet;
        document.getElementById('balance').innerText = stars;
        // случайные 3 мины
        mines = [];
        while(mines.length < 3) {
            let r = Math.floor(Math.random()*16);
            if(!mines.includes(r)) mines.push(r);
        }
        opened = [];
        multiplier = 1;
        document.getElementById('multiplier').innerText = multiplier.toFixed(2)+'x';
        gameActive = true;
        document.getElementById('status').innerText = "Игра началась. Открывайте клетки!";
        // обновить вид поля
        for(let i=0;i<16;i++) {
            cells[i].classList.remove('opened-safe','opened-mine');
            cells[i].innerText = '❓';
        }
    }

    function openCell(idx) {
        if (!gameActive) return;
        if (opened.includes(idx)) return;
        if (mines.includes(idx)) {
            // проигрыш
            gameActive = false;
            for(let m of mines) {
                cells[m].classList.add('opened-mine');
                cells[m].innerText = '💣';
            }
            document.getElementById('status').innerHTML = "💥 Вы проиграли!";
            return;
        }
        opened.push(idx);
        cells[idx].classList.add('opened-safe');
        cells[idx].innerText = '💰';
        multiplier = 1 + (opened.length * 0.25);
        document.getElementById('multiplier').innerText = multiplier.toFixed(2)+'x';
        if(opened.length === 13) {
            // автовыигрыш
            cashout();
        }
    }

    function cashout() {
        if(!gameActive) return;
        const win = Math.floor(bet * multiplier);
        stars += win;
        document.getElementById('balance').innerText = stars;
        gameActive = false;
        document.getElementById('status').innerHTML = `🏆 Вы выиграли ${win} звёзд!`;
        // показать мины
        for(let m of mines) {
            cells[m].classList.add('opened-mine');
            cells[m].innerText = '💣';
        }
    }

    document.getElementById('newGameBtn').onclick = startNewRound;
    document.getElementById('cashoutBtn').onclick = cashout;

    initField();
</script>
</body>
</html>

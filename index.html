<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 MINA - Коэффициент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #0d0d1f 0%, #05050f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(145deg, #16162e, #0b0b18);
            border-radius: 32px;
            padding: 24px 20px 28px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .balance-box {
            background: #0a0a18;
            border-radius: 40px;
            padding: 6px 16px 6px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #2a2a50;
        }
        .balance-box span {
            color: #7788aa;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .balance-box .value {
            color: #ffd93d;
            font-size: 24px;
            font-weight: 800;
            min-width: 50px;
            text-align: center;
        }

        .bet-section {
            background: #0a0a18;
            border-radius: 20px;
            padding: 14px 16px;
            margin: 10px 0 14px;
            border: 1px solid #1f1f3e;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bet-section label {
            color: #7788aa;
            font-size: 13px;
            font-weight: 600;
        }
        .bet-section input {
            flex: 1;
            background: #12122a;
            border: 1px solid #2a2a52;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: 700;
            color: #ffd93d;
            outline: none;
            width: 80px;
            min-width: 60px;
        }
        .bet-section input:focus {
            border-color: #ffd93d;
        }
        .bet-section .btn-bet {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 6px 0 #7a1a1a;
            letter-spacing: 0.5px;
        }
        .bet-section .btn-bet:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a1a1a;
        }
        .bet-section .btn-bet:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a1a1a;
            cursor: not-allowed;
        }

        .coef-display {
            text-align: center;
            padding: 8px 0 4px;
            font-size: 14px;
            color: #556688;
        }
        .coef-display .coef {
            font-size: 42px;
            font-weight: 900;
            color: #ffd93d;
            text-shadow: 0 0 40px rgba(255,217,61,0.15);
            display: inline-block;
            min-width: 80px;
        }
        .coef-display .coef.green {
            color: #00e676;
        }
        .coef-display .coef.red {
            color: #ff1744;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 12px 0 14px;
            aspect-ratio: 1;
            max-width: 100%;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #1c1c3a, #12122a);
            border-radius: 14px;
            border: 2px solid #22224a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #aabbdd;
            box-shadow: inset 0 -4px 0 #0a0a16;
            position: relative;
        }
        .cell:active:not(.revealed):not(.disabled) {
            transform: scale(0.92);
        }
        .cell.revealed {
            background: #0a0a1a;
            border-color: #2a2a52;
            cursor: default;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
        }
        .cell.mine {
            background: #2a0a0a;
            border-color: #661122;
            color: #ff1744;
        }
        .cell.gem {
            background: #0a1a0a;
            border-color: #00c853;
            color: #00e676;
        }
        .cell.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .cell .label {
            font-size: 12px;
            color: #445577;
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-weight: 400;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin: 6px 0 10px;
        }
        .btn-group .btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
            letter-spacing: 0.3px;
        }
        .btn-group .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
        .btn-primary { background: #3d5afe; color: white; border-bottom: 2px solid #1a237e; }
        .btn-success { background: #00c853; color: white; border-bottom: 2px solid #1b5e20; }
        .btn-danger { background: #d32f2f; color: white; border-bottom: 2px solid #7f0000; }
        .btn-warning { background: #ffb300; color: #0a0a18; border-bottom: 2px solid #b26500; }

        .input-row {
            display: flex;
            gap: 8px;
            margin: 6px 0 4px;
        }
        .input-row input {
            flex: 1;
            background: #0a0a18;
            border: 1px solid #1f1f3e;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 14px;
            color: #dde4f0;
            outline: none;
        }
        .input-row input:focus {
            border-color: #3d5afe;
        }
        .input-row input::placeholder {
            color: #445566;
        }
        .input-row .btn {
            flex: 0 0 auto;
            padding: 8px 20px;
            min-width: auto;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            color: #445577;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
            padding: 4px 4px;
            border-bottom: 1px solid #161630;
        }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
            margin-top: 4px;
            padding-right: 4px;
        }
        .history-list::-webkit-scrollbar {
            width: 3px;
        }
        .history-list::-webkit-scrollbar-track {
            background: #0a0a18;
            border-radius: 10px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #2a2a52;
            border-radius: 10px;
        }

        .history-item {
            background: #0a0a18;
            border-radius: 30px;
            padding: 6px 14px 6px 18px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #161630;
            font-size: 13px;
            color: #99aacc;
        }
        .history-item .link {
            color: #66bbff;
            text-decoration: none;
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
            font-size: 12px;
        }
        .history-item .trash {
            background: none;
            border: none;
            color: #445577;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            transition: 0.1s;
        }
        .history-item .trash:hover {
            color: #ff1744;
        }
        .empty-state {
            text-align: center;
            color: #2a2a4a;
            padding: 12px 0;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            color: #223355;
            font-size: 11px;
            margin-top: 12px;
            border-top: 1px solid #0f0f22;
            padding-top: 12px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #16162e;
            padding: 32px 36px;
            border-radius: 40px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 1px solid #3a3a66;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
        }
        .modal h2 {
            font-size: 52px;
            margin-bottom: 2px;
        }
        .modal .result {
            font-size: 28px;
            font-weight: 800;
            margin: 6px 0 4px;
        }
        .modal .result.win { color: #00e676; }
        .modal .result.lose { color: #ff1744; }
        .modal .detail {
            color: #8899bb;
            font-size: 16px;
            margin: 4px 0 16px;
        }
        .modal .btn {
            padding: 12px 40px;
            border: none;
            border-radius: 40px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            background: #3d5afe;
            color: white;
            box-shadow: 0 6px 0 #1a237e;
            transition: 0.1s;
        }
        .modal .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1a237e;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">💎 MINA</div>
        <div class="balance-box">
            <span>💰</span>
            <span class="value" id="balanceDisplay">1000</span>
        </div>
    </div>

    <div class="bet-section">
        <label>СТАВКА</label>
        <input type="number" id="betInput" value="10" min="1" step="1">
        <button class="btn-bet" id="startBtn">▶ ИГРАТЬ</button>
    </div>

    <div class="coef-display">
        КОЭФФИЦИЕНТ: <span class="coef" id="coefDisplay">1.00</span>x
    </div>

    <div class="grid" id="grid"></div>

    <div class="btn-group">
        <button class="btn btn-primary" id="newGameBtn">🔄 Новая</button>
        <button class="btn btn-success" id="depositBtn">➕ Пополнить</button>
        <button class="btn btn-danger" id="withdrawBtn">➖ Вывести</button>
    </div>

    <div class="input-row">
        <input type="text" id="nameInput" placeholder="Название (ViceCream)" />
        <button class="btn btn-warning" id="addToListBtn">📋 Добавить</button>
    </div>

    <div class="list-header">
        <span>📌 Список ссылок</span>
        <span>🗑️</span>
    </div>
    <div class="history-list" id="historyList">
        <div class="empty-state">✦ Нет записей</div>
    </div>

    <div class="footer">⚡ t.me/nft/название-рандом</div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modalEmoji">💎</h2>
        <div class="result" id="modalResult">+0</div>
        <div class="detail" id="modalDetail">Коэффициент: 1.00x</div>
        <button class="btn" id="modalBtn">Продолжить</button>
    </div>
</div>

<script>
    (function() {
        // ====== CONFIG ======
        const SIZE = 4;
        const CELLS = SIZE * SIZE;
        let mineCount = 3; // количество мин

        // ====== STATE ======
        let balance = 1000;
        let history = [];
        let grid = [];
        let revealed = [];
        let isMine = [];
        let gameActive = false;
        let gameStarted = false;
        let currentBet = 10;
        let currentCoef = 1.00;
        let revealedCount = 0;
        let totalSafe = CELLS - mineCount;

        // ====== DOM ======
        const gridEl = document.getElementById('grid');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const coefDisplay = document.getElementById('coefDisplay');
        const betInput = document.getElementById('betInput');
        const startBtn = document.getElementById('startBtn');
        const historyListEl = document.getElementById('historyList');
        const nameInput = document.getElementById('nameInput');
        const modal = document.getElementById('modal');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalResult = document.getElementById('modalResult');
        const modalDetail = document.getElementById('modalDetail');
        const modalBtn = document.getElementById('modalBtn');

        // ====== LOCAL STORAGE ======
        function saveState() {
            try {
                localStorage.setItem('minaCoefData', JSON.stringify({ balance, history }));
            } catch(e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('minaCoefData');
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (typeof data.balance === 'number') balance = data.balance;
                if (Array.isArray(data.history)) history = data.history.filter(h => h && h.id && h.link);
                return true;
            } catch(e) { return false; }
        }

        // ====== GRID ======
        function initGrid() {
            grid = [];
            revealed = [];
            isMine = [];
            for (let i = 0; i < CELLS; i++) {
                grid[i] = 0;
                revealed[i] = false;
                isMine[i] = false;
            }
            gameActive = false;
            gameStarted = false;
            revealedCount = 0;
            currentCoef = 1.00;
            coefDisplay.textContent = '1.00';
            coefDisplay.className = 'coef';
            renderGrid();
            startBtn.disabled = false;
            startBtn.textContent = '▶ ИГРАТЬ';
        }

        function placeMines() {
            // сброс
            for (let i = 0; i < CELLS; i++) isMine[i] = false;
            let placed = 0;
            while (placed < mineCount) {
                const idx = Math.floor(Math.random() * CELLS);
                if (!isMine[idx]) {
                    isMine[idx] = true;
                    placed++;
                }
            }
            // считаем соседей
            for (let i = 0; i < CELLS; i++) {
                if (isMine[i]) { grid[i] = -1; continue; }
                let count = 0;
                const neighbors = getNeighbors(i);
                for (const n of neighbors) {
                    if (isMine[n]) count++;
                }
                grid[i] = count;
            }
        }

        function getNeighbors(idx) {
            const r = Math.floor(idx / SIZE);
            const c = idx % SIZE;
            const result = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
                        result.push(nr * SIZE + nc);
                    }
                }
            }
            return result;
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            for (let i = 0; i < CELLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.idx = i;
                if (revealed[i]) {
                    cell.classList.add('revealed');
                    if (isMine[i]) {
                        cell.classList.add('mine');
                        cell.textContent = '💣';
                    } else if (grid[i] > 0) {
                        cell.textContent = grid[i];
                        cell.style.color = ['', '#4fc3f7', '#81c784', '#ff8a65', '#ce93d8', '#ef5350'][grid[i]] || '#fff';
                    } else {
                        cell.textContent = '✦';
                        cell.style.color = '#2a2a52';
                    }
                } else {
                    if (gameActive && !gameStarted) {
                        cell.textContent = '?';
                        cell.style.color = '#445577';
                    } else {
                        cell.textContent = '';
                    }
                }
                if (!gameActive || gameStarted) {
                    cell.classList.add('disabled');
                }
                cell.addEventListener('click', () => onCellClick(i));
                gridEl.appendChild(cell);
            }
        }

        // ====== GAME LOGIC ======
        function startGame() {
            const bet = parseInt(betInput.value);
            if (isNaN(bet) || bet <= 0) {
                alert('Введите корректную ставку!');
                return;
            }
            if (bet > balance) {
                alert('Недостаточно средств! Баланс: ' + balance);
                return;
            }
            currentBet = bet;
            balance -= bet;
            updateBalance();
            saveState();

            initGrid();
            placeMines();
            gameActive = true;
            gameStarted = false;
            revealedCount = 0;
            currentCoef = 1.00;
            coefDisplay.textContent = '1.00';
            coefDisplay.className = 'coef';
            startBtn.disabled = true;
            startBtn.textContent = '⏳ ИГРА';

            renderGrid();
        }

        function onCellClick(idx) {
            if (!gameActive || gameStarted) return;
            if (revealed[idx]) return;

            // первый клик — старт
            gameStarted = true;

            // если попали на мину — проигрыш
            if (isMine[idx]) {
                revealed[idx] = true;
                gameActive = false;
                gameStarted = false;
                renderGrid();
                // показываем все мины
                for (let i = 0; i < CELLS; i++) {
                    if (isMine[i]) revealed[i] = true;
                }
                renderGrid();
                startBtn.disabled = false;
                startBtn.textContent = '🔄 Новая';
                showResult(false, 0);
                return;
            }

            // открываем клетку
            revealCell(idx);
            renderGrid();
            updateCoef();

            // проверка победы
            if (revealedCount === totalSafe) {
                gameActive = false;
                gameStarted = false;
                startBtn.disabled = false;
                startBtn.textContent = '🔄 Новая';
                const winAmount = Math.floor(currentBet * currentCoef);
                balance += winAmount;
                updateBalance();
                saveState();
                showResult(true, winAmount);
            }
        }

        function revealCell(idx) {
            if (revealed[idx]) return;
            if (isMine[idx]) return;
            revealed[idx] = true;
            revealedCount++;

            if (grid[idx] === 0) {
                const neighbors = getNeighbors(idx);
                for (const n of neighbors) {
                    if (!revealed[n] && !isMine[n]) {
                        revealCell(n);
                    }
                }
            }
        }

        function updateCoef() {
            const progress = revealedCount / totalSafe;
            // коэффициент растёт экспоненциально: 1.00 -> до ~10x
            currentCoef = 1.00 + (progress * progress * 9.0);
            currentCoef = Math.round(currentCoef * 100) / 100;
            coefDisplay.textContent = currentCoef.toFixed(2);
            if (currentCoef > 3.0) coefDisplay.className = 'coef green';
            else if (currentCoef > 6.0) coefDisplay.className = 'coef green';
        }

        function showResult(win, amount) {
            modal.classList.add('show');
            if (win) {
                modalEmoji.textContent = '🎉';
                modalResult.textContent = '+' + amount;
                modalResult.className = 'result win';
                modalDetail.textContent = 'Коэффициент: ' + currentCoef.toFixed(2) + 'x';
            } else {
                modalEmoji.textContent = '💥';
                modalResult.textContent = '-' + currentBet;
                modalResult.className = 'result lose';
                modalDetail.textContent = 'Вы наступили на мину!';
            }
        }

        // ====== UI UPDATES ======
        function updateBalance() {
            balanceDisplay.textContent = balance;
        }

        // ====== HISTORY ======
        function renderHistory() {
            historyListEl.innerHTML = '';
            if (history.length === 0) {
                historyListEl.innerHTML = '<div class="empty-state">✦ Нет записей</div>';
                return;
            }
            const reversed = [...history].reverse();
            for (const item of reversed) {
                const div = document.createElement('div');
                div.className = 'history-item';
                const link = document.createElement('a');
                link.className = 'link';
                link.href = item.link;
                link.target = '_blank';
                link.textContent = item.link;
                const trash = document.createElement('button');
                trash.className = 'trash';
                trash.textContent = '🗑️';
                trash.addEventListener('click', (e) => {
                    e.stopPropagation();
                    history = history.filter(h => h.id !== item.id);
                    renderHistory();
                    saveState();
                });
                div.appendChild(link);
                div.appendChild(trash);
                historyListEl.appendChild(div);
            }
        }

        function addHistory(name) {
            if (!name.trim()) {
                alert('Введите название!');
                return false;
            }
            const suffix = Math.floor(Math.random() * 9000) + 1000;
            const link = `https://t.me/nft/${name.trim()}-${suffix}`;
            history.push({
                id: Date.now() + Math.random() * 1000,
                name: name.trim(),
                link: link,
            });
            renderHistory();
            saveState();
            nameInput.value = '';
            return true;
        }

        // ====== BUTTONS ======
        startBtn.addEventListener('click', startGame);

        document.getElementById('newGameBtn').addEventListener('click', () => {
            if (gameActive && !gameStarted) {
                if (!confirm('Прервать игру?')) return;
            }
            initGrid();
            modal.classList.remove('show');
            startBtn.disabled = false;
            startBtn.textContent = '▶ ИГРАТЬ';
            gameActive = false;
            gameStarted = false;
        });

        document.getElementById('depositBtn').addEventListener('click', () => {
            const amt = prompt('💰 Сумма пополнения:', '100');
            if (amt === null) return;
            const v = parseInt(amt);
            if (isNaN(v) || v <= 0) { alert('Введите число > 0'); return; }
            balance += v;
            updateBalance();
            saveState();
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            const amt = prompt('💸 Сумма вывода:', '50');
            if (amt === null) return;
            const v = parseInt(amt);
            if (isNaN(v) || v <= 0) { alert('Введите число > 0'); return; }
            if (v > balance) { alert('Недостаточно средств!'); return; }
            balance -= v;
            updateBalance();
            saveState();
        });

        document.getElementById('addToListBtn').addEventListener('click', () => {
            addHistory(nameInput.value);
        });

        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addHistory(nameInput.value);
            }
        });

        modalBtn.addEventListener('click', () => {
            modal.classList.remove('show');
            initGrid();
            startBtn.disabled = false;
            startBtn.textContent = '▶ ИГРАТЬ';
            gameActive = false;
            gameStarted = false;
        });

        // ====== INIT ======
        loadState();
        initGrid();
        renderHistory();
        updateBalance();
        saveState();

        // настройка мин
        document.querySelector('.bet-section .btn-bet').addEventListener('click', startGame);
    })();
</script>
</body>
</html>

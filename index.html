<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💣 MINA - Сапёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: linear-gradient(145deg, #1e1e32, #14141f);
            border-radius: 32px;
            padding: 24px 20px 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255,80,80,0.3);
            letter-spacing: 1px;
        }
        .title span {
            color: #ffd93d;
            font-weight: 300;
        }

        .balance-box {
            background: #0c0c18;
            border-radius: 60px;
            padding: 8px 18px 8px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #2a2a44;
        }
        .balance-box span {
            color: #aab;
            font-size: 13px;
            font-weight: 500;
        }
        .balance-box .value {
            color: #ffd93d;
            font-size: 22px;
            font-weight: 700;
            min-width: 60px;
            text-align: center;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            background: #0c0c18;
            border-radius: 16px;
            padding: 10px 16px;
            margin-bottom: 14px;
            border: 1px solid #25253d;
        }
        .stat {
            color: #8899bb;
            font-size: 13px;
        }
        .stat b {
            color: #dde4f0;
            font-size: 16px;
            margin-left: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin: 12px 0 16px;
            aspect-ratio: 1;
            max-width: 100%;
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #2a2a4a, #1a1a30);
            border-radius: 8px;
            border: 1px solid #333355;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.08s ease;
            color: #eee;
            text-shadow: 0 0 12px rgba(255,255,255,0.2);
            box-shadow: inset 0 -3px 0 #0a0a16;
        }
        .cell:active {
            transform: scale(0.92);
        }
        .cell.revealed {
            background: #1a1a2e;
            border-color: #2a2a4a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            cursor: default;
        }
        .cell.mine {
            background: #441122;
            border-color: #882244;
        }
        .cell.flagged {
            background: #1a2a3a;
            border-color: #ffd93d;
        }
        .cell[data-num="1"] { color: #4fc3f7; }
        .cell[data-num="2"] { color: #81c784; }
        .cell[data-num="3"] { color: #ff8a65; }
        .cell[data-num="4"] { color: #ce93d8; }
        .cell[data-num="5"] { color: #ef5350; }
        .cell[data-num="6"] { color: #4dd0e1; }
        .cell[data-num="7"] { color: #fff176; }
        .cell[data-num="8"] { color: #ffab91; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 12px 0 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 70px;
            padding: 12px 10px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.12s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
        .btn-primary {
            background: #3d5afe;
            color: white;
            border-bottom: 2px solid #1a237e;
        }
        .btn-success {
            background: #00c853;
            color: white;
            border-bottom: 2px solid #1b5e20;
        }
        .btn-danger {
            background: #d32f2f;
            color: white;
            border-bottom: 2px solid #7f0000;
        }
        .btn-warning {
            background: #ffb300;
            color: #1a1a2e;
            border-bottom: 2px solid #b26500;
        }
        .btn-outline {
            background: transparent;
            color: #99aacc;
            border: 2px solid #333366;
            box-shadow: none;
        }
        .btn-outline:active {
            transform: scale(0.95);
            box-shadow: none;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            color: #667799;
            font-size: 13px;
            font-weight: 600;
            margin-top: 16px;
            padding: 6px 4px;
            border-bottom: 1px solid #1f1f38;
        }
        .list-header span:last-child {
            color: #556688;
        }

        .history-list {
            max-height: 160px;
            overflow-y: auto;
            margin-top: 6px;
            padding-right: 4px;
        }
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: #0c0c18;
            border-radius: 10px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #333366;
            border-radius: 10px;
        }

        .history-item {
            background: #0f0f20;
            border-radius: 40px;
            padding: 8px 16px 8px 20px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1f1f3a;
            transition: 0.1s;
            font-size: 14px;
            color: #bbccee;
        }
        .history-item .link {
            color: #66bbff;
            text-decoration: none;
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
        }
        .history-item .link:hover {
            color: #99ddff;
        }
        .history-item .trash {
            background: none;
            border: none;
            color: #555577;
            cursor: pointer;
            font-size: 18px;
            padding: 2px 8px;
            border-radius: 30px;
            transition: 0.1s;
        }
        .history-item .trash:hover {
            background: #441122;
            color: #ff6b6b;
        }
        .empty-state {
            text-align: center;
            color: #334466;
            padding: 20px 0;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin: 6px 0 4px;
        }
        .input-row input {
            flex: 1;
            background: #0c0c1a;
            border: 1px solid #2a2a4a;
            border-radius: 60px;
            padding: 10px 18px;
            font-size: 14px;
            color: #dde4f0;
            outline: none;
            transition: 0.1s;
        }
        .input-row input:focus {
            border-color: #3d5afe;
            background: #12122a;
        }
        .input-row input::placeholder {
            color: #445566;
        }
        .input-row .btn {
            flex: 0 0 auto;
            padding: 10px 22px;
            min-width: auto;
        }

        .footer {
            text-align: center;
            color: #334466;
            font-size: 11px;
            margin-top: 14px;
            border-top: 1px solid #1a1a30;
            padding-top: 14px;
            letter-spacing: 0.5px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #1a1a30;
            padding: 32px 40px;
            border-radius: 40px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 1px solid #3a3a66;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }
        .modal h2 {
            font-size: 38px;
            margin-bottom: 4px;
        }
        .modal p {
            color: #aabbdd;
            font-size: 18px;
            margin: 10px 0 18px;
        }
        .modal .btn {
            min-width: 120px;
            margin: 4px auto;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="title">💣 MIN<span>A</span></div>
        <div class="balance-box">
            <span>💰</span>
            <span class="value" id="balanceDisplay">1000</span>
        </div>
    </div>

    <!-- Stats -->
    <div class="game-stats">
        <div class="stat">💣 <b id="mineCount">10</b></div>
        <div class="stat">🚩 <b id="flagCount">0</b></div>
        <div class="stat">⏱️ <b id="gameStatus">▶</b></div>
    </div>

    <!-- Grid 8x8 -->
    <div class="grid" id="grid"></div>

    <!-- Buttons -->
    <div class="btn-group">
        <button class="btn btn-primary" id="newGameBtn">🔄 Новая</button>
        <button class="btn btn-success" id="depositBtn">➕ Пополнить</button>
        <button class="btn btn-danger" id="withdrawBtn">➖ Вывести</button>
    </div>

    <!-- Input + Add to list -->
    <div class="input-row">
        <input type="text" id="nameInput" placeholder="Название (ViceCream)" />
        <button class="btn btn-warning" id="addToListBtn">📋 Добавить</button>
    </div>

    <!-- History list -->
    <div class="list-header">
        <span>📌 Список ссылок</span>
        <span>🗑️ удалить</span>
    </div>
    <div class="history-list" id="historyList">
        <div class="empty-state">✦ Нет записей</div>
    </div>

    <div class="footer">⚡ t.me/nft/название-рандом</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modalEmoji">💥</h2>
        <p id="modalText">Игра окончена!</p>
        <button class="btn btn-primary" id="modalBtn">Играть снова</button>
    </div>
</div>

<script>
    (function() {
        // ====== CONFIG ======
        const ROWS = 8;
        const COLS = 8;
        const TOTAL_MINES = 10;

        // ====== STATE ======
        let balance = 1000;
        let history = []; // [{ id, name, link }]
        let grid = [];
        let revealed = [];
        let flagged = [];
        let gameOver = false;
        let firstClick = true;
        let minesPlaced = false;
        let flagCount = 0;

        // ====== DOM ======
        const gridEl = document.getElementById('grid');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const mineCountEl = document.getElementById('mineCount');
        const flagCountEl = document.getElementById('flagCount');
        const gameStatusEl = document.getElementById('gameStatus');
        const historyListEl = document.getElementById('historyList');
        const nameInput = document.getElementById('nameInput');
        const modal = document.getElementById('modal');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalText = document.getElementById('modalText');
        const modalBtn = document.getElementById('modalBtn');

        // ====== LOCAL STORAGE ======
        function saveState() {
            try {
                localStorage.setItem('minaGameData', JSON.stringify({
                    balance,
                    history,
                }));
            } catch(e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('minaGameData');
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (typeof data.balance === 'number') balance = data.balance;
                if (Array.isArray(data.history)) history = data.history.filter(h => h && h.id && h.link);
                return true;
            } catch(e) { return false; }
        }

        // ====== GRID ======
        function initGrid() {
            grid = [];
            revealed = [];
            flagged = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                revealed[r] = [];
                flagged[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = 0;
                    revealed[r][c] = false;
                    flagged[r][c] = false;
                }
            }
            gameOver = false;
            firstClick = true;
            minesPlaced = false;
            flagCount = 0;
            updateStats();
            renderGrid();
            gameStatusEl.textContent = '▶';
        }

        function placeMines(safeRow, safeCol) {
            let placed = 0;
            while (placed < TOTAL_MINES) {
                const r = Math.floor(Math.random() * ROWS);
                const c = Math.floor(Math.random() * COLS);
                if (grid[r][c] === -1) continue;
                if (Math.abs(r - safeRow) <= 1 && Math.abs(c - safeCol) <= 1) continue;
                grid[r][c] = -1;
                placed++;
            }
            // numbers
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] === -1) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === -1) count++;
                        }
                    }
                    grid[r][c] = count;
                }
            }
            minesPlaced = true;
            mineCountEl.textContent = TOTAL_MINES;
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    if (revealed[r][c]) {
                        cell.classList.add('revealed');
                        if (grid[r][c] === -1) {
                            cell.textContent = '💣';
                            cell.classList.add('mine');
                        } else if (grid[r][c] > 0) {
                            cell.textContent = grid[r][c];
                            cell.dataset.num = grid[r][c];
                        }
                    } else if (flagged[r][c]) {
                        cell.classList.add('flagged');
                        cell.textContent = '🚩';
                    }
                    cell.addEventListener('click', () => onCellClick(r, c));
                    cell.addEventListener('contextmenu', (e) => { e.preventDefault(); onCellRightClick(r, c); });
                    gridEl.appendChild(cell);
                }
            }
        }

        function updateStats() {
            flagCountEl.textContent = flagCount;
            const remaining = TOTAL_MINES - flagCount;
            mineCountEl.textContent = remaining >= 0 ? remaining : 0;
            balanceDisplay.textContent = balance;
        }

        // ====== GAME LOGIC ======
        function onCellClick(r, c) {
            if (gameOver) return;
            if (flagged[r][c]) return;
            if (revealed[r][c]) return;

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
            }

            reveal(r, c);
            renderGrid();
            updateStats();
            checkWin();
        }

        function onCellRightClick(r, c) {
            if (gameOver) return;
            if (revealed[r][c]) return;
            flagged[r][c] = !flagged[r][c];
            flagCount += flagged[r][c] ? 1 : -1;
            renderGrid();
            updateStats();
        }

        function reveal(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
            if (revealed[r][c]) return;
            if (flagged[r][c]) return;

            revealed[r][c] = true;

            if (grid[r][c] === -1) {
                // BOOM
                gameOver = true;
                revealAllMines();
                renderGrid();
                gameStatusEl.textContent = '💥';
                showModal('💥', 'Вы наступили на мину!', -50);
                return;
            }

            if (grid[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        reveal(r + dr, c + dc);
                    }
                }
            }
        }

        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] === -1) {
                        revealed[r][c] = true;
                    }
                }
            }
        }

        function checkWin() {
            let totalRevealed = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (revealed[r][c]) totalRevealed++;
                }
            }
            const totalSafe = ROWS * COLS - TOTAL_MINES;
            if (totalRevealed === totalSafe && !gameOver) {
                gameOver = true;
                gameStatusEl.textContent = '🏆';
                showModal('🎉', 'Вы победили! +100 монет', 100);
            }
        }

        // ====== MODAL ======
        function showModal(emoji, text, amount) {
            modalEmoji.textContent = emoji;
            modalText.textContent = text;
            if (amount !== 0) {
                balance += amount;
                if (balance < 0) balance = 0;
                updateStats();
                saveState();
            }
            modal.classList.add('show');
        }

        modalBtn.addEventListener('click', () => {
            modal.classList.remove('show');
            initGrid();
        });

        // ====== HISTORY ======
        function renderHistory() {
            historyListEl.innerHTML = '';
            if (history.length === 0) {
                historyListEl.innerHTML = '<div class="empty-state">✦ Нет записей</div>';
                return;
            }
            const reversed = [...history].reverse();
            for (const item of reversed) {
                const div = document.createElement('div');
                div.className = 'history-item';
                const link = document.createElement('a');
                link.className = 'link';
                link.href = item.link;
                link.target = '_blank';
                link.textContent = item.link;
                const trash = document.createElement('button');
                trash.className = 'trash';
                trash.textContent = '🗑️';
                trash.addEventListener('click', (e) => {
                    e.stopPropagation();
                    history = history.filter(h => h.id !== item.id);
                    renderHistory();
                    saveState();
                });
                div.appendChild(link);
                div.appendChild(trash);
                historyListEl.appendChild(div);
            }
        }

        function addHistory(name) {
            if (!name.trim()) {
                alert('Введите название!');
                return false;
            }
            const suffix = Math.floor(Math.random() * 9000) + 1000;
            const link = `https://t.me/nft/${name.trim()}-${suffix}`;
            history.push({
                id: Date.now() + Math.random() * 1000,
                name: name.trim(),
                link: link,
            });
            renderHistory();
            saveState();
            nameInput.value = '';
            return true;
        }

        // ====== BUTTONS ======
        document.getElementById('newGameBtn').addEventListener('click', () => {
            if (confirm('Начать новую игру?')) {
                initGrid();
                modal.classList.remove('show');
            }
        });

        document.getElementById('depositBtn').addEventListener('click', () => {
            const amt = prompt('💰 Сумма пополнения:', '100');
            if (amt === null) return;
            const v = parseInt(amt);
            if (isNaN(v) || v <= 0) { alert('Введите число > 0'); return; }
            balance += v;
            updateStats();
            saveState();
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            const amt = prompt('💸 Сумма вывода:', '50');
            if (amt === null) return;
            const v = parseInt(amt);
            if (isNaN(v) || v <= 0) { alert('Введите число > 0'); return; }
            if (v > balance) { alert('Недостаточно средств!'); return; }
            balance -= v;
            updateStats();
            saveState();
        });

        document.getElementById('addToListBtn').addEventListener('click', () => {
            addHistory(nameInput.value);
        });

        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addHistory(nameInput.value);
            }
        });

        // ====== INIT ======
        loadState();
        initGrid();
        renderHistory();
        updateStats();
        saveState();
    })();
</script>
</body>
</html>

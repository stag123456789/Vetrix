<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>STREAMER CASINO — Crash & Mines</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #000000 100%);
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            min-height: 100vh;
            color: #fff;
        }

        /* Основной контейнер */
        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid #ffd700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .tab.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            box-shadow: 0 0 15px #ffd700;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Карточки */
        .card {
            background: rgba(10, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* Баланс пользователя */
        .balance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-balance {
            background: linear-gradient(135deg, #1a1a2a, #0a0a15);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid #ffd700;
        }

        .user-balance span {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Игровые зоны */
        .game-zone {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
        }

        /* Crash game */
        .crash-graph {
            background: #1a1a2a;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .multiplier {
            font-size: 64px;
            font-weight: bold;
            color: #ffd700;
            font-family: monospace;
        }

        .crash-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        /* Mines game */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        .mine-cell {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .mine-cell.revealed {
            background: linear-gradient(145deg, #3a3a4a, #2a2a3a);
        }

        .mine-cell.bomb {
            background: linear-gradient(145deg, #ff0000, #aa0000);
        }

        /* Каналы */
        .channels-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel-item {
            background: rgba(20, 20, 40, 0.9);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .channel-info h3 {
            color: #ffd700;
        }

        .channel-balance {
            font-size: 20px;
            font-weight: bold;
        }

        .auc-section {
            background: #1a1a2a;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
        }

        .stars {
            display: flex;
            gap: 5px;
            margin: 10px 0;
        }

        .star {
            font-size: 24px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .star:hover {
            transform: scale(1.2);
        }

        .star.active {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        button {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        input, select {
            padding: 10px;
            background: #2a2a3a;
            border: 1px solid #ffd700;
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2a, #0a0a15);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="balance-header">
        <div class="user-balance">
            👤 YOUR BALANCE: <span id="userBalance">1000</span> 💎
        </div>
        <div>
            <button id="withdrawBtn">💸 WITHDRAW</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="crash">💥 CRASH</div>
        <div class="tab" data-tab="mines">💣 MINES</div>
        <div class="tab" data-tab="channels">📺 CHANNELS</div>
        <div class="tab" data-tab="admin">👑 ADMIN</div>
    </div>

    <!-- CRASH GAME -->
    <div id="crash" class="tab-content active">
        <div class="card">
            <div class="crash-graph">
                <div class="multiplier" id="multiplier">1.00x</div>
                <div id="crashStatus" style="margin: 20px; font-size: 18px;">💰 PLACE YOUR BET</div>
                <input type="number" id="crashBet" placeholder="Bet amount" value="10" style="padding: 12px; font-size: 16px; width: 200px;">
                <div>
                    <button id="startCrash" class="crash-btn" style="background: linear-gradient(135deg,#00ff00,#00aa00)">🚀 START</button>
                    <button id="cashoutBtn" class="crash-btn" style="background: linear-gradient(135deg,#ffd700,#ffaa00); color:#000">💰 CASHOUT</button>
                </div>
                <div id="crashResult" style="margin-top: 15px; font-size: 14px;"></div>
            </div>
        </div>
    </div>

    <!-- MINES GAME -->
    <div id="mines" class="tab-content">
        <div class="card">
            <div class="game-zone">
                <div style="text-align: center; margin-bottom: 20px;">
                    <input type="number" id="minesBet" value="10" placeholder="Bet" style="width: 120px;">
                    <select id="minesCount">
                        <option value="1">1 mine</option>
                        <option value="3" selected>3 mines</option>
                        <option value="5">5 mines</option>
                    </select>
                    <button id="newMinesGame">🔄 NEW GAME</button>
                </div>
                <div class="mines-grid" id="minesGrid"></div>
                <div style="text-align: center; margin-top: 20px;">
                    <button id="cashoutMines">💰 CASHOUT</button>
                </div>
                <div id="minesResult" style="text-align: center; margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- CHANNELS -->
    <div id="channels" class="tab-content">
        <div class="card">
            <button id="createChannelBtn">➕ CREATE CHANNEL</button>
            <div class="channels-list" id="channelsList"></div>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="admin" class="tab-content">
        <div class="card">
            <h3>👑 ADMIN PANEL</h3>
            <input type="password" id="adminPass" placeholder="Enter admin code">
            <button id="adminUnlock">UNLOCK</button>
            <div id="adminContent" style="display: none; margin-top: 20px;">
                <h4>Global Settings</h4>
                <button id="addAllBalance">➕ ADD 1000 TO ALL USERS</button>
                <button id="resetDB">🔄 RESET DATABASE</button>
                <hr style="margin: 15px 0;">
                <h4>Crash Settings</h4>
                <label>Crash house edge: <input type="number" id="crashEdge" value="5" step="1">%</label>
                <hr>
                <h4>Mines Settings</h4>
                <label>Mines multiplier: <input type="number" id="minesMult" value="1.5" step="0.1"></label>
            </div>
        </div>
    </div>
</div>

<!-- Withdraw modal -->
<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h2>💸 WITHDRAW</h2>
        <input type="number" id="withdrawAmount" placeholder="Amount">
        <input type="text" id="withdrawAddress" placeholder="Wallet address">
        <button id="submitWithdraw">SUBMIT</button>
        <button id="closeWithdraw">CANCEL</button>
    </div>
</div>

<!-- Create channel modal -->
<div id="channelModal" class="modal">
    <div class="modal-content">
        <h2>📺 CREATE CHANNEL</h2>
        <input type="text" id="channelName" placeholder="Channel name">
        <button id="submitChannel">CREATE</button>
        <button id="closeChannel">CANCEL</button>
    </div>
</div>

<script>
    // ============== STATE ==============
    let gameState = {
        user: {
            balance: 1000,
            totalSpins: 0,
            totalWin: 0
        },
        channels: [],
        adminCode: '1337'
    };

    let crashState = {
        active: false,
        bet: 0,
        multiplier: 1.00,
        crashed: false,
        interval: null
    };

    let minesState = {
        active: false,
        bet: 0,
        bombs: [],
        revealed: [],
        win: 0,
        currentMultiplier: 1
    };

    // ============== SAVE/LOAD ==============
    function saveData() {
        localStorage.setItem('casino_data', JSON.stringify({
            user: gameState.user,
            channels: gameState.channels
        }));
    }

    function loadData() {
        const saved = localStorage.getItem('casino_data');
        if (saved) {
            const data = JSON.parse(saved);
            gameState.user = data.user;
            gameState.channels = data.channels || [];
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById('userBalance').innerText = Math.floor(gameState.user.balance);
        renderChannels();
    }

    // ============== CRASH GAME ==============
    function startCrash() {
        if (crashState.active) return;
        let bet = parseInt(document.getElementById('crashBet').value);
        if (bet > gameState.user.balance || bet <= 0) {
            document.getElementById('crashResult').innerHTML = '❌ Invalid bet!';
            return;
        }

        gameState.user.balance -= bet;
        crashState.bet = bet;
        crashState.active = true;
        crashState.crashed = false;
        crashState.multiplier = 1.00;
        document.getElementById('multiplier').innerText = '1.00x';
        document.getElementById('crashStatus').innerHTML = '🚀 FLYING...';
        document.getElementById('crashResult').innerHTML = '';
        updateUI();

        // Random crash point between 1.01 and 100
        const crashPoint = 1 + Math.random() * 20;
        
        crashState.interval = setInterval(() => {
            if (!crashState.active) return;
            crashState.multiplier += 0.03;
            document.getElementById('multiplier').innerText = crashState.multiplier.toFixed(2) + 'x';
            
            if (crashState.multiplier >= crashPoint) {
                clearInterval(crashState.interval);
                crashState.active = false;
                document.getElementById('crashStatus').innerHTML = '💥 CRASHED!';
                document.getElementById('crashResult').innerHTML = `You lost ${crashState.bet} 💎`;
                updateUI();
                saveData();
            }
        }, 50);
    }

    function cashout() {
        if (!crashState.active || crashState.crashed) return;
        clearInterval(crashState.interval);
        const win = Math.floor(crashState.bet * crashState.multiplier);
        gameState.user.balance += win;
        gameState.user.totalWin += win;
        gameState.user.totalSpins++;
        crashState.active = false;
        document.getElementById('crashStatus').innerHTML = '✅ CASHED OUT!';
        document.getElementById('crashResult').innerHTML = `🎉 You won ${win} 💎`;
        updateUI();
        saveData();
    }

    // ============== MINES GAME ==============
    function initMines() {
        const bombCount = parseInt(document.getElementById('minesCount').value);
        minesState.bombs = [];
        minesState.revealed = [];
        minesState.active = true;
        
        while (minesState.bombs.length < bombCount) {
            const pos = Math.floor(Math.random() * 25);
            if (!minesState.bombs.includes(pos)) {
                minesState.bombs.push(pos);
            }
        }
        
        renderMinesGrid();
        document.getElementById('minesResult').innerHTML = '';
    }

    function renderMinesGrid() {
        const grid = document.getElementById('minesGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.className = 'mine-cell';
            if (minesState.revealed.includes(i)) {
                if (minesState.bombs.includes(i)) {
                    cell.classList.add('bomb');
                    cell.innerHTML = '💣';
                } else {
                    cell.innerHTML = '💎';
                }
            } else {
                cell.innerHTML = '?';
            }
            cell.onclick = () => revealMine(i);
            grid.appendChild(cell);
        }
    }

    function revealMine(pos) {
        if (!minesState.active) return;
        if (minesState.revealed.includes(pos)) return;
        
        minesState.revealed.push(pos);
        
        if (minesState.bombs.includes(pos)) {
            minesState.active = false;
            document.getElementById('minesResult').innerHTML = `💥 BOMB! You lost ${minesState.bet} 💎`;
            renderMinesGrid();
            updateUI();
            saveData();
            return;
        }
        
        const safeRevealed = minesState.revealed.filter(r => !minesState.bombs.includes(r)).length;
        const multiplier = 1 + (safeRevealed * 0.2);
        minesState.currentMultiplier = multiplier;
        document.getElementById('minesResult').innerHTML = `🎯 Safe: ${safeRevealed}/25 | Multiplier: ${multiplier.toFixed(2)}x`;
        renderMinesGrid();
    }

    function cashoutMines() {
        if (!minesState.active) return;
        const win = Math.floor(minesState.bet * minesState.currentMultiplier);
        gameState.user.balance += win;
        gameState.user.totalWin += win;
        gameState.user.totalSpins++;
        minesState.active = false;
        document.getElementById('minesResult').innerHTML = `🎉 CASHED OUT! Won ${win} 💎`;
        updateUI();
        saveData();
        initMines();
    }

    function startMines() {
        let bet = parseInt(document.getElementById('minesBet').value);
        if (bet > gameState.user.balance || bet <= 0) {
            document.getElementById('minesResult').innerHTML = '❌ Invalid bet!';
            return;
        }
        gameState.user.balance -= bet;
        minesState.bet = bet;
        minesState.active = true;
        minesState.currentMultiplier = 1;
        updateUI();
        initMines();
    }

    // ============== CHANNELS ==============
    function renderChannels() {
        const container = document.getElementById('channelsList');
        if (!container) return;
        container.innerHTML = '';
        
        gameState.channels.forEach((channel, idx) => {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `
                <div class="channel-info">
                    <h3>📺 ${channel.name}</h3>
                    <div>💰 Balance: ${channel.balance} 💎</div>
                    <div>⭐ Stars: ${channel.stars || 0}</div>
                </div>
                <div>
                    <button onclick="showAUC(${idx})">🎤 /auc</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function createChannel(name) {
        if (!name) return;
        gameState.channels.push({
            name: name,
            balance: 0,
            stars: 0,
            history: []
        });
        saveData();
        renderChannels();
    }

    function showAUC(channelIdx) {
        const channel = gameState.channels[channelIdx];
        const starsHtml = Array(10).fill(0).map((_, i) => 
            `<span class="star" data-star="${i+1}" data-channel="${channelIdx}">⭐</span>`
        ).join('');
        
        document.getElementById('minesResult').innerHTML = `
            <div class="auc-section">
                <h3>🎤 /auc - ${channel.name}</h3>
                <div class="stars" id="aucStars">${starsHtml}</div>
                <div id="aucMessage">Click stars to support!</div>
            </div>
        `;
        
        document.querySelectorAll('.star').forEach(star => {
            star.onclick = (e) => {
                const starVal = parseInt(e.target.dataset.star);
                const chIdx = parseInt(e.target.dataset.channel);
                gameState.channels[chIdx].stars = (gameState.channels[chIdx].stars || 0) + starVal;
                saveData();
                document.getElementById('aucMessage').innerHTML = `✅ +${starVal} stars!`;
                renderChannels();
                setTimeout(() => {
                    document.getElementById('aucMessage').innerHTML = 'Click stars to support!';
                }, 2000);
            };
        });
    }

    // ============== WITHDRAW ==============
    function withdraw(amount, address) {
        if (amount > gameState.user.balance) {
            alert('Not enough balance!');
            return;
        }
        gameState.user.balance -= amount;
        saveData();
        updateUI();
        alert(`Withdrawal request: ${amount} 💎 to ${address}\nProcessed!`);
    }

    // ============== ADMIN ==============
    function adminUnlock(pass) {
        if (pass === gameState.adminCode) {
            document.getElementById('adminContent').style.display = 'block';
            return true;
        }
        alert('Wrong code!');
        return false;
    }

    // ============== INIT ==============
    loadData();

    // Event listeners
    document.getElementById('startCrash').onclick = startCrash;
    document.getElementById('cashoutBtn').onclick = cashout;
    document.getElementById('newMinesGame').onclick = startMines;
    document.getElementById('cashoutMines').onclick = cashoutMines;
    document.getElementById('withdrawBtn').onclick = () => document.getElementById('withdrawModal').classList.add('active');
    document.getElementById('closeWithdraw').onclick = () => document.getElementById('withdrawModal').classList.remove('active');
    document.getElementById('submitWithdraw').onclick = () => {
        const amount = parseInt(document.getElementById('withdrawAmount').value);
        const address = document.getElementById('withdrawAddress').value;
        if (amount && address) withdraw(amount, address);
        document.getElementById('withdrawModal').classList.remove('active');
    };
    document.getElementById('createChannelBtn').onclick = () => document.getElementById('channelModal').classList.add('active');
    document.getElementById('closeChannel').onclick = () => document.getElementById('channelModal').classList.remove('active');
    document.getElementById('submitChannel').onclick = () => {
        const name = document.getElementById('channelName').value;
        if (name) createChannel(name);
        document.getElementById('channelModal').classList.remove('active');
    };
    document.getElementById('adminUnlock').onclick = () => {
        const pass = document.getElementById('adminPass').value;
        adminUnlock(pass);
    };
    document.getElementById('addAllBalance').onclick = () => {
        gameState.user.balance += 1000;
        updateUI();
        saveData();
    };
    document.getElementById('resetDB').onclick = () => {
        gameState.user = { balance: 1000, totalSpins: 0, totalWin: 0 };
        gameState.channels = [];
        saveData();
        updateUI();
        alert('Database reset!');
    };

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        };
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Stealer</title>
    <style>
        body{background:#000;font-family:monospace;color:#0f0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .box{max-width:500px;background:#0a0f0a;border:1px solid #0f0;border-radius:20px;padding:25px}
        input,button{width:100%;padding:12px;margin:8px 0;background:#050a05;border:1px solid #0a0;color:#0f0;font-family:monospace;border-radius:10px}
        button{background:#0a1a0a;font-weight:bold;cursor:pointer}
        button:active{background:#0f0;color:#000}
        .qr{text-align:center;margin-top:20px;display:none}
        .qr img{background:#fff;padding:10px;border-radius:16px;width:200px}
        .hint{font-size:11px;color:#6a6;text-align:center;margin-top:15px}
    </style>
</head>
<body>
<div class="box">
    <h2>📷 QR STEALER</h2>
    <input type="text" id="ip" placeholder="IP iPhone from terminal">
    <input type="text" id="port" placeholder="Port" value="8080">
    <button id="gen">⚡ CREATE QR</button>
    <div id="qrArea" class="qr">
        <img id="qrImg">
        <button id="save">💾 SAVE</button>
        <div id="link" class="hint"></div>
    </div>
    <div class="hint">1. Run server.py on iPhone<br>2. Enter IP from terminal<br>3. Scan QR with Redmi</div>
</div>
<script>
document.getElementById('gen').onclick = function(){
    let ip = document.getElementById('ip').value.trim();
    let port = document.getElementById('port').value.trim();
    if(!ip){alert('Enter IP'); return}
    if(!port) port = '8080';
    let url = 'http://' + ip + ':' + port + '/';
    let qr = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(url);
    document.getElementById('qrImg').src = qr;
    document.getElementById('link').innerHTML = url;
    document.getElementById('qrArea').style.display = 'block';
    document.getElementById('save').onclick = function(){
        let a = document.createElement('a');
        a.download = 'qr.png';
        a.href = qr;
        a.click();
    };
};
</script>
</body>
</html>

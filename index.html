<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⭐ CRYPTO CASINO — CRASH & MINES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #000000);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        /* Контейнер */
        .app {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(15, 25, 35, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 28px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance-card {
            background: linear-gradient(135deg, #1a2a3a, #0f1a24);
            padding: 8px 20px;
            border-radius: 40px;
            border-left: 3px solid #ffd700;
        }

        .balance-label {
            font-size: 12px;
            color: #aaa;
        }

        .balance-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffd700;
            letter-spacing: 1px;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .tab {
            background: rgba(20, 30, 45, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 14px;
        }

        .tab.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 15px #ffd700;
        }

        /* Карточки игр */
        .game-card {
            background: rgba(10, 20, 30, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            margin-bottom: 30px;
        }

        /* Crash */
        .crash-area {
            text-align: center;
        }
        .multiplier {
            font-size: 72px;
            font-weight: 800;
            font-family: monospace;
            background: linear-gradient(135deg, #ffd700, #ff8800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .crash-btn {
            background: linear-gradient(135deg, #00cc66, #009944);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin: 8px;
            transition: 0.1s;
            color: white;
        }
        .cashout-btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
        }

        /* Mines */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 20px auto;
        }
        .mine-cell {
            aspect-ratio: 1;
            background: #1e2a36;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        .mine-cell.revealed-safed {
            background: #2a5a3a;
        }
        .mine-cell.bombed {
            background: #8b1a1a;
        }

        /* Каналы */
        .channels-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .channel-row {
            background: rgba(20, 30, 45, 0.8);
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-left: 4px solid #ffd700;
        }
        .channel-name {
            font-size: 18px;
            font-weight: bold;
        }
        .channel-stars {
            color: #ffd700;
        }

        /* Аукцион */
        .auc-panel {
            background: #0f1a24;
            border-radius: 24px;
            padding: 20px;
            margin-top: 20px;
        }
        .stars-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .star-btn {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.1s;
        }
        .star-btn:hover {
            transform: scale(1.2);
        }

        /* Кнопки */
        button {
            cursor: pointer;
            transition: 0.1s;
            font-weight: 600;
        }
        button:active {
            transform: scale(0.96);
        }

        input, select {
            background: #1e2a36;
            border: 1px solid #ffd700;
            padding: 10px 14px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
        }

        /* Модалки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #0f1a24;
            border-radius: 32px;
            padding: 28px;
            max-width: 400px;
            width: 90%;
            border-top: 4px solid #ffd700;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance-card">
            <div class="balance-label">💎 YOUR BALANCE</div>
            <div class="balance-value" id="userBalance">1000</div>
        </div>
        <button id="withdrawBtn" style="background:#1e2a36; border:1px solid #ffd700; padding:8px 22px; border-radius:40px;">💸 WITHDRAW</button>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="crash">💥 CRASH</div>
        <div class="tab" data-tab="mines">💣 MINES</div>
        <div class="tab" data-tab="channels">📺 CHANNELS / AUC</div>
        <div class="tab" data-tab="admin">👑 ADMIN</div>
    </div>

    <!-- CRASH -->
    <div id="crash" class="tab-content active">
        <div class="game-card crash-area">
            <div class="multiplier" id="multiplier">1.00x</div>
            <div id="crashStatus" style="margin: 12px;">⚡ PLACE BET</div>
            <input type="number" id="crashBet" value="10" style="width:180px; text-align:center;">
            <div>
                <button id="startCrash" class="crash-btn">🚀 START</button>
                <button id="cashoutBtn" class="crash-btn cashout-btn">💰 CASHOUT</button>
            </div>
            <div id="crashResult" style="margin-top: 20px; font-size:14px;"></div>
        </div>
    </div>

    <!-- MINES -->
    <div id="mines" class="tab-content">
        <div class="game-card">
            <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;">
                <input type="number" id="minesBet" value="10" placeholder="BET">
                <select id="minesCount">
                    <option value="1">1 mine</option>
                    <option value="3" selected>3 mines</option>
                    <option value="5">5 mines</option>
                </select>
                <button id="newMinesGame" style="background:#2a5a3a;">🔄 NEW GAME</button>
                <button id="cashoutMines" style="background:#ffd700; color:#000;">💰 CASHOUT</button>
            </div>
            <div class="mines-grid" id="minesGrid"></div>
            <div id="minesResult" style="text-align:center; margin-top: 20px;"></div>
        </div>
    </div>

    <!-- CHANNELS / AUC -->
    <div id="channels" class="tab-content">
        <div class="game-card">
            <button id="createChannelBtn" style="background:#ffd700; color:#000; margin-bottom: 20px;">➕ CREATE CHANNEL</button>
            <div class="channels-grid" id="channelsList"></div>
            <div id="aucDynamicPanel" style="margin-top: 30px;"></div>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="admin" class="tab-content">
        <div class="game-card">
            <h3 style="color:#ffd700;">👑 ADMIN ZONE</h3>
            <input type="password" id="adminPass" placeholder="Admin code">
            <button id="adminUnlock">UNLOCK</button>
            <div id="adminContent" style="display: none; margin-top: 20px;">
                <label>➕ ADD BALANCE TO USER: <input type="number" id="adminAddAmount" value="500"></label>
                <button id="addBalanceBtn">ADD</button>
                <hr style="margin: 15px 0;">
                <label>⭐ ADD STARS TO CHANNEL:<br>
                    <input type="text" id="channelNameForStars" placeholder="Channel name">
                    <input type="number" id="starAmount" value="10">
                </label>
                <button id="addStarsBtn">ADD STARS</button>
                <hr>
                <button id="resetAllBtn" style="background:#8b1a1a;">⚠️ RESET DATABASE</button>
            </div>
        </div>
    </div>
</div>

<!-- WITHDRAW MODAL -->
<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h3>💸 WITHDRAW</h3>
        <input type="number" id="withdrawAmount" placeholder="Amount">
        <input type="text" id="withdrawAddress" placeholder="Wallet / User">
        <button id="submitWithdraw" style="margin-top: 15px;">SUBMIT</button>
        <button id="closeWithdraw">CANCEL</button>
    </div>
</div>

<!-- CREATE CHANNEL MODAL -->
<div id="channelModal" class="modal">
    <div class="modal-content">
        <h3>📺 CREATE CHANNEL</h3>
        <input type="text" id="channelName" placeholder="Channel name">
        <button id="submitChannel" style="margin-top: 12px;">CREATE</button>
        <button id="closeChannel">CANCEL</button>
    </div>
</div>

<script>
    // ========== STATE ==========
    let state = {
        user: { balance: 1000, totalSpins: 0, totalWin: 0 },
        channels: [],
        adminCode: "1337"
    };

    let crash = { active: false, bet: 0, multiplier: 1.00, interval: null };
    let mines = { active: false, bet: 0, bombs: [], revealed: [], currentMulti: 1 };

    // ========== SAVE/LOAD ==========
    function save() { localStorage.setItem('casino_pro', JSON.stringify({ user: state.user, channels: state.channels })); }
    function load() {
        let d = localStorage.getItem('casino_pro');
        if (d) {
            let p = JSON.parse(d);
            state.user = p.user;
            state.channels = p.channels || [];
        }
        updateUI();
        renderChannels();
    }

    function updateUI() { document.getElementById('userBalance').innerText = Math.floor(state.user.balance); }

    // ========== RENDER CHANNELS ==========
    function renderChannels() {
        let container = document.getElementById('channelsList');
        if (!container) return;
        container.innerHTML = '';
        state.channels.forEach((ch, idx) => {
            let div = document.createElement('div');
            div.className = 'channel-row';
            div.innerHTML = `
                <div><span class="channel-name">📺 ${ch.name}</span><br>💰 ${ch.balance || 0} | ⭐ ${ch.stars || 0}</div>
                <button class="aucTriggerBtn" data-idx="${idx}">🎤 /auc</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.aucTriggerBtn').forEach(btn => {
            btn.onclick = () => showAuction(parseInt(btn.dataset.idx));
        });
    }

    // ========== AUCTION (можно ставить звёзды и владельцу) ==========
    function showAuction(channelIdx) {
        let ch = state.channels[channelIdx];
        let starsHtml = '';
        for (let i = 1; i <= 10; i++) starsHtml += `<button class="star-btn" data-stars="${i}">⭐ ${i}</button>`;
        let panel = document.getElementById('aucDynamicPanel');
        panel.innerHTML = `
            <div class="auc-panel">
                <h3>🎤 /auc — ${ch.name}</h3>
                <div class="stars-row" id="aucStars">${starsHtml}</div>
                <div id="aucMessage">⭐ Click star to support (owner can also)</div>
            </div>
        `;
        document.querySelectorAll('.star-btn').forEach(btn => {
            btn.onclick = (e) => {
                let starsVal = parseInt(btn.dataset.stars);
                // Можно ставить звёзды любому, в том числе себе
                ch.stars = (ch.stars || 0) + starsVal;
                save();
                renderChannels();
                document.getElementById('aucMessage').innerHTML = `✅ +${starsVal} stars to ${ch.name}! Thanks!`;
                setTimeout(() => { document.getElementById('aucMessage').innerHTML = '⭐ Click star to support'; }, 2000);
            };
        });
    }

    // ========== CRASH ==========
    function startCrashGame() {
        if (crash.active) return;
        let bet = parseInt(document.getElementById('crashBet').value);
        if (bet > state.user.balance || bet <= 0) { document.getElementById('crashResult').innerHTML = '❌ Invalid bet'; return; }
        state.user.balance -= bet;
        updateUI();
        crash.active = true;
        crash.bet = bet;
        crash.multiplier = 1.00;
        document.getElementById('multiplier').innerText = '1.00x';
        document.getElementById('crashStatus').innerHTML = '🚀 FLYING ...';
        let crashPoint = 1 + Math.random() * 18;
        if (crash.interval) clearInterval(crash.interval);
        crash.interval = setInterval(() => {
            if (!crash.active) return;
            crash.multiplier += 0.025;
            document.getElementById('multiplier').innerText = crash.multiplier.toFixed(2) + 'x';
            if (crash.multiplier >= crashPoint) {
                clearInterval(crash.interval);
                crash.active = false;
                document.getElementById('crashStatus').innerHTML = '💥 CRASHED';
                document.getElementById('crashResult').innerHTML = `You lost ${crash.bet} 💎`;
                save();
            }
        }, 45);
    }
    function cashoutCrash() {
        if (!crash.active) return;
        clearInterval(crash.interval);
        let win = Math.floor(crash.bet * crash.multiplier);
        state.user.balance += win;
        state.user.totalWin += win;
        state.user.totalSpins++;
        crash.active = false;
        document.getElementById('crashStatus').innerHTML = '✅ CASHED OUT';
        document.getElementById('crashResult').innerHTML = `🎉 Won ${win} 💎`;
        updateUI();
        save();
    }

    // ========== MINES ==========
    function initMinesGame() {
        let bombsCount = parseInt(document.getElementById('minesCount').value);
        mines.bombs = [];
        while (mines.bombs.length < bombsCount) {
            let r = Math.floor(Math.random() * 25);
            if (!mines.bombs.includes(r)) mines.bombs.push(r);
        }
        mines.revealed = [];
        mines.active = true;
        mines.currentMulti = 1;
        renderMinesGrid();
        document.getElementById('minesResult').innerHTML = `💣 ${bombsCount} mines | Multiplier 1.00x`;
    }
    function renderMinesGrid() {
        let grid = document.getElementById('minesGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            let cell = document.createElement('div');
            cell.className = 'mine-cell';
            if (mines.revealed.includes(i)) {
                if (mines.bombs.includes(i)) { cell.classList.add('bombed'); cell.innerHTML = '💣'; }
                else { cell.classList.add('revealed-safed'); cell.innerHTML = '💎'; }
            } else cell.innerHTML = '?';
            cell.onclick = () => revealMineCell(i);
            grid.appendChild(cell);
        }
    }
    function revealMineCell(pos) {
        if (!mines.active) return;
        if (mines.revealed.includes(pos)) return;
        mines.revealed.push(pos);
        if (mines.bombs.includes(pos)) {
            mines.active = false;
            document.getElementById('minesResult').innerHTML = `💥 BOMB! You lost ${mines.bet}`;
            renderMinesGrid();
            save();
            return;
        }
        let safeCount = mines.revealed.filter(r => !mines.bombs.includes(r)).length;
        let multi = 1 + (safeCount * 0.18);
        mines.currentMulti = multi;
        document.getElementById('minesResult').innerHTML = `✅ SAFE ${safeCount}/25 | Multi ${multi.toFixed(2)}x`;
        renderMinesGrid();
    }
    function startMinesGame() {
        let bet = parseInt(document.getElementById('minesBet').value);
        if (bet > state.user.balance) { document.getElementById('minesResult').innerHTML = '❌ No balance'; return; }
        state.user.balance -= bet;
        mines.bet = bet;
        updateUI();
        initMinesGame();
    }
    function cashoutMinesGame() {
        if (!mines.active) return;
        let win = Math.floor(mines.bet * mines.currentMulti);
        state.user.balance += win;
        state.user.totalWin += win;
        state.user.totalSpins++;
        mines.active = false;
        document.getElementById('minesResult').innerHTML = `💰 CASHOUT! Won ${win} 💎`;
        updateUI();
        save();
    }

    // ========== ADMIN ==========
    function adminUnlock(pass) {
        if (pass === state.adminCode) {
            document.getElementById('adminContent').style.display = 'block';
            return true;
        } else alert('Wrong code!');
        return false;
    }

    // ========== CHANNEL CREATE ==========
    function createChannel(name) {
        if (!name.trim()) return;
        state.channels.push({ name: name, balance: 0, stars: 0 });
        save();
        renderChannels();
    }

    // ========== WITHDRAW ==========
    function withdraw(amount, addr) {
        if (amount > state.user.balance) { alert('Not enough'); return; }
        state.user.balance -= amount;
        save();
        updateUI();
        alert(`Withdraw ${amount} to ${addr} (demo)`);
    }

    // ========== EVENTS ==========
    document.getElementById('startCrash').onclick = startCrashGame;
    document.getElementById('cashoutBtn').onclick = cashoutCrash;
    document.getElementById('newMinesGame').onclick = startMinesGame;
    document.getElementById('cashoutMines').onclick = cashoutMinesGame;
    document.getElementById('withdrawBtn').onclick = () => document.getElementById('withdrawModal').classList.add('active');
    document.getElementById('closeWithdraw').onclick = () => document.getElementById('withdrawModal').classList.remove('active');
    document.getElementById('submitWithdraw').onclick = () => {
        let amt = parseInt(document.getElementById('withdrawAmount').value);
        let addr = document.getElementById('withdrawAddress').value;
        if (amt && addr) withdraw(amt, addr);
        document.getElementById('withdrawModal').classList.remove('active');
    };
    document.getElementById('createChannelBtn').onclick = () => document.getElementById('channelModal').classList.add('active');
    document.getElementById('closeChannel').onclick = () => document.getElementById('channelModal').classList.remove('active');
    document.getElementById('submitChannel').onclick = () => {
        let name = document.getElementById('channelName').value;
        if (name) createChannel(name);
        document.getElementById('channelModal').classList.remove('active');
    };
    document.getElementById('adminUnlock').onclick = () => adminUnlock(document.getElementById('adminPass').value);
    document.getElementById('addBalanceBtn').onclick = () => {
        let addVal = parseInt(document.getElementById('adminAddAmount').value);
        if (addVal) { state.user.balance += addVal; save(); updateUI(); alert(`Added ${addVal}`); }
    };
    document.getElementById('addStarsBtn').onclick = () => {
        let chName = document.getElementById('channelNameForStars').value;
        let starsAdd = parseInt(document.getElementById('starAmount').value);
        let found = state.channels.find(c => c.name === chName);
        if (found) { found.stars = (found.stars || 0) + starsAdd; save(); renderChannels(); alert(`Added ${starsAdd} stars to ${chName}`); }
        else alert('Channel not found');
    };
    document.getElementById('resetAllBtn').onclick = () => {
        if (confirm('RESET ALL DATA?')) {
            state.user = { balance: 1000, totalSpins: 0, totalWin: 0 };
            state.channels = [];
            save();
            updateUI();
            renderChannels();
            alert('Reset done');
        }
    };
    // tabs
    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            t.classList.add('active');
            document.getElementById(t.dataset.tab).classList.add('active');
        };
    });

    load();
    renderChannels();
</script>
</body>
</html>

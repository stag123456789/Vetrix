<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1e2a3a; color: white; font-family: system-ui; padding: 20px; text-align: center; }
        button { background: gold; border: none; padding: 15px 30px; font-size: 20px; border-radius: 30px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Тест мини-приложения</h1>
    <p id="info">Загрузка...</p>
    <button id="testBtn">Нажми меня</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let user = tg.initDataUnsafe?.user;
        let infoText = user ? `Пользователь: ${user.first_name} (ID: ${user.id})` : "⚠️ Данные пользователя не получены. Откройте через кнопку бота.";
        document.getElementById('info').innerText = infoText;

        document.getElementById('testBtn').onclick = () => {
            tg.showPopup({ title: "Успех", message: "Кнопка работает!" });
        };
    </script>
</body>
</html>
